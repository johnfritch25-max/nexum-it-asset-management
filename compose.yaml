# Nexum IT Asset Management System — Docker Compose Configuration
# Based on Asseto Asset Management by Vyrazu Labs
#
# Services:
#   web   — Django + Gunicorn application server
#   db    — PostgreSQL 15 database
#   nginx — Nginx reverse proxy (serves static files + proxies to web)
#
# Usage:
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Logs:   docker compose logs -f
#   Build:  docker compose up -d --build
#
# Access the application at: http://localhost:8080

services:

  # ── Application server ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexum-itam:latest
    container_name: nexum-itam-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn AssetManagement.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - django-static:/app/staticfiles
      - django-media:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexum-net

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: nexum-itam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexum-net

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexum-itam-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django-static:/app/staticfiles:ro
      - django-media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - nexum-net

# ── Named volumes ─────────────────────────────────────────────────────────
volumes:
  django-static:
    name: nexum-itam-static
  django-media:
    name: nexum-itam-media
  pg-data:
    name: nexum-itam-pgdata

# ── Network ───────────────────────────────────────────────────────────────
networks:
  nexum-net:
    name: nexum-itam-network
